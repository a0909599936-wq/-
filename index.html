<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Classic Snake</title>

<style>
body{
  margin:0;
  background:black;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  overflow:hidden;
  font-family:monospace;
}

canvas{
  border:4px solid #00ff00;
  background:#000;
  image-rendering:pixelated;
}

#score{
  position:absolute;
  top:20px;
  color:#00ff00;
  font-size:24px;
}
</style>
</head>
<body>

<div id="score">SCORE: 0</div>
<canvas id="game" width="400" height="400"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const scoreText = document.getElementById("score");

const gridSize = 20;
const tileCount = canvas.width / gridSize;

let snake = [{x:10,y:10}];

let food = {
  x:15,
  y:15
};

let dx = 0;
let dy = 0;
let score = 0;

function gameLoop(){
  update();
  draw();
}

function update(){

  const head = {
    x: snake[0].x + dx,
    y: snake[0].y + dy
  };

  if(
    head.x < 0 ||
    head.y < 0 ||
    head.x >= tileCount ||
    head.y >= tileCount
  ){
    gameOver();
    return;
  }

  for(let part of snake){
    if(head.x === part.x && head.y === part.y){
      gameOver();
      return;
    }
  }

  snake.unshift(head);

  if(head.x === food.x && head.y === food.y){

    score++;
    scoreText.textContent = "SCORE: " + score;

    food.x = Math.floor(Math.random() * tileCount);
    food.y = Math.floor(Math.random() * tileCount);

  }else{
    snake.pop();
  }
}

function draw(){

  ctx.fillStyle = "black";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  ctx.fillStyle = "#00ff00";

  for(let part of snake){
    ctx.fillRect(
      part.x * gridSize,
      part.y * gridSize,
      gridSize - 2,
      gridSize - 2
    );
  }

  ctx.fillStyle = "red";

  ctx.fillRect(
    food.x * gridSize,
    food.y * gridSize,
    gridSize - 2,
    gridSize - 2
  );
}

function gameOver(){

  alert("GAME OVER\n分數: " + score);

  snake = [{x:10,y:10}];
  dx = 0;
  dy = 0;
  score = 0;

  scoreText.textContent = "SCORE: 0";
}

document.addEventListener("keydown",(e)=>{

  switch(e.key){

    case "ArrowUp":
    case "w":
      if(dy !== 1){
        dx = 0;
        dy = -1;
      }
      break;

    case "ArrowDown":
    case "s":
      if(dy !== -1){
        dx = 0;
        dy = 1;
      }
      break;

    case "ArrowLeft":
    case "a":
      if(dx !== 1){
        dx = -1;
        dy = 0;
      }
      break;

    case "ArrowRight":
    case "d":
      if(dx !== -1){
        dx = 1;
        dy = 0;
      }
      break;
  }

});

setInterval(gameLoop,100);
</script>

</body>
</html>
